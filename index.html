<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f8f7ff" />
<!-- 防止前进/后退缓存导致状态异常 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>挂圈欢迎</title>

<!-- 预连接 -->
<link rel="preconnect" href="https://cdn.phototourl.com" crossorigin />

<style>
    /* ========== 全局重置 ========== */
    *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
    }

    /* ========== 亮色主题变量 ========== */
    :root {
        --bg-primary:    #faf9ff;
        --bg-secondary:  #f3f0ff;
        --bg-card:       #ffffff;
        --text-primary:  #1e1b2e;
        --text-secondary:#6b6388;
        --text-muted:    #a09bb5;
        --accent-purple: #7c3aed;
        --accent-light:  #a78bfa;
        --accent-pink:   #ec4899;
        --accent-amber:  #f59e0b;
        --border-light:   rgba(124, 58, 237, 0.12);
        --border-hover:  rgba(124, 58, 237, 0.35);
        --shadow-card:   0 4px 24px rgba(124, 58, 237, 0.06);
        --shadow-hover:  0 16px 60px rgba(124, 58, 237, 0.14);
        --gradient-text: linear-gradient(135deg, #7c3aed, #ec4899, #f59e0b);
        --gradient-btn:  linear-gradient(135deg, #7c3aed, #6d28d9);
        --gradient-line: linear-gradient(90deg, #7c3aed, #ec4899);
    }

    body {
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow: hidden;
        overscroll-behavior: none;
    }

    /* ========== 进入动画层 ========== */
    .loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: linear-gradient(160deg, #faf9ff 0%, #f3f0ff 50%, #ede9fe 100%);
        transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1);
        will-change: transform;
    }

    .loader.hidden {
        transform: translateY(-100%);
        pointer-events: none;
    }

    .logo {
        font-size: 60px;
        font-weight: 700;
        letter-spacing: 16px;
        color: var(--accent-purple);
        text-shadow: 0 0 30px rgba(124, 58, 237, .25), 0 0 60px rgba(124, 58, 237, .12);
        opacity: 0;
        transform: translateY(40px);
        animation: logoSlideUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes logoSlideUp {
        0%   { opacity: 0; transform: translateY(40px); }
        60%  { opacity: 1; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(0); }
    }

    /* ========== 主页容器 ========== */
    .homepage {
        position: relative;
        z-index: 10;
        opacity: 1;
        transform: translateY(100vh);
        transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1);
        overflow-y: auto;
        height: 100vh;
        background: var(--bg-primary);
    }

    .homepage.show {
        transform: translateY(0);
    }

    /* ========== Hero 区域 ========== */
    .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 80px 24px 60px;
        background: linear-gradient(160deg, #faf9ff 0%, #f5f3ff 40%, #ede9fe 100%);
        position: relative;
        contain: layout style;
        overflow: hidden;
    }

    .hero::before {
        content: "";
        position: absolute;
        top: -120px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(124, 58, 237, 0.08) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
    }

    .hero > * {
        position: relative;
        z-index: 1;
    }

    .hero-badge {
        display: inline-block;
        padding: 6px 18px;
        border: 1px solid rgba(124, 58, 237, 0.25);
        border-radius: 20px;
        font-size: 13px;
        color: var(--accent-purple);
        letter-spacing: 3px;
        margin-bottom: 28px;
        background: rgba(124, 58, 237, 0.06);
        font-weight: 500;
    }

    .hero-title {
        font-size: clamp(40px, 6vw, 72px);
        font-weight: 800;
        letter-spacing: 8px;
        color: var(--text-primary);
        line-height: 1.2;
        margin-bottom: 24px;
    }

    .hero-title .accent {
        background: var(--gradient-text);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .hero-subtitle {
        font-size: clamp(16px, 2vw, 20px);
        color: var(--text-secondary);
        letter-spacing: 4px;
        margin-bottom: 48px;
        max-width: 600px;
        line-height: 1.8;
    }

    /* ========== 按钮 ========== */
    .hero-cta {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn-primary {
        padding: 14px 40px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #fff;
        background: var(--gradient-btn);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        text-decoration: none;
        display: inline-block;
        will-change: transform;
        box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-btn);
    }

    .btn-outline {
        padding: 14px 40px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 3px;
        color: var(--accent-purple);
        background: transparent;
        border: 1.5px solid rgba(124, 58, 237, 0.35);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-block;
    }

    .btn-outline:hover {
        background: rgba(124, 58, 237, 0.06);
        border-color: var(--accent-purple);
        color: var(--accent-purple);
    }

    /* ========== 群主ks按钮 ========== */
    .btn-ks {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 36px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #fff;
        background: linear-gradient(135deg, #ec4899, #f59e0b);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.3s, box-shadow 0.3s;
        will-change: transform;
        box-shadow: 0 4px 14px rgba(236, 72, 153, 0.3);
    }

    .btn-ks:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(236, 72, 153, 0.45);
    }

    /* ========== 标签页跳转按钮 ========== */
    .btn-tab {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 36px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #fff;
        background: linear-gradient(135deg, #3b82f6, #7c3aed);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.3s, box-shadow 0.3s;
        will-change: transform;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
    }

    .btn-tab:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(59, 130, 246, 0.45);
    }

    /* ========== 二维码宣传图区域 ========== */
    .qrcode-section {
        padding: 100px 24px;
        max-width: 1200px;
        margin: 0 auto;
        contain: layout style;
    }

    .section-header {
        text-align: center;
        margin-bottom: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
    }

    .section-header h2 {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 700;
        letter-spacing: 6px;
        color: var(--text-primary);
        margin-bottom: 0;
    }

    .section-header p {
        font-size: 15px;
        color: var(--text-muted);
        letter-spacing: 3px;
        width: 100%;
        margin-top: 8px;
    }

    /* 加入其他群聊按钮（标题旁 / 独立行） */
    .btn-other-group {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 36px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 3px;
        color: #fff;
        background: linear-gradient(135deg, #10b981, #059669);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.3s, box-shadow 0.3s;
        will-change: transform;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
        white-space: nowrap;
    }

    .btn-other-group:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(16, 185, 129, 0.45);
    }

    /* 二维码卡片网格 */
    .qrcode-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px;
    }

    .qrcode-card {
        background: var(--bg-card);
        border: 1px solid var(--border-light);
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
        transition: transform 0.35s, border-color 0.35s, box-shadow 0.35s;
        overflow: hidden;
        will-change: transform;
        box-shadow: var(--shadow-card);
    }

    .qrcode-card:hover {
        transform: translateY(-6px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow-hover);
    }

    .qrcode-card .img-wrap {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 24px;
        overflow: hidden;
        background: var(--bg-secondary);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 0 1px rgba(124, 58, 237, 0.05);
    }

    .qrcode-card .img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s;
    }

    .qrcode-card .img-wrap.qr-wrap {
        aspect-ratio: 1 / 1;
        padding: 16px;
        background: #fff;
        border: 1px solid var(--border-light);
    }

    .qrcode-card .img-wrap.qr-wrap img {
        border-radius: 12px;
    }

    .qrcode-card:hover .img-wrap.qr-wrap img {
        transform: scale(1.03);
    }

    /* QQ 加群按钮 */
    .qrcode-card .qq-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 28px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 2px;
        color: var(--accent-purple);
        border: 1px solid rgba(124, 58, 237, 0.3);
        border-radius: 6px;
        text-decoration: none;
        transition: all 0.3s;
    }

    .qrcode-card .qq-btn:hover {
        background: rgba(124, 58, 237, 0.08);
        border-color: var(--accent-purple);
        color: var(--accent-purple);
    }

    .qrcode-card h3 {
        font-size: 18px;
        font-weight: 600;
        color: var(--text-primary);
        letter-spacing: 2px;
        margin-bottom: 6px;
    }

    .qrcode-card p {
        font-size: 13px;
        color: var(--text-muted);
        letter-spacing: 1px;
        margin-bottom: 18px;
    }

    /* ========== 页脚 ========== */
    .footer {
        text-align: center;
        padding: 36px 24px;
        border-top: 1px solid var(--border-light);
        background: var(--bg-secondary);
        margin-top: 40px;
    }

    .footer p {
        font-size: 13px;
        color: var(--text-muted);
        letter-spacing: 2px;
        margin-bottom: 12px;
    }

    .footer-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 2px;
        color: var(--accent-purple);
        background: rgba(124, 58, 237, 0.06);
        border: 1px solid rgba(124, 58, 237, 0.25);
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.3s;
    }

    .footer-link:hover {
        background: rgba(124, 58, 237, 0.12);
        border-color: var(--accent-purple);
        color: var(--accent-purple);
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(124, 58, 237, 0.15);
    }

    /* ========== 响应式 ========== */
    @media (max-width: 900px) {
        .qrcode-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 640px) {
        .hero-title {
            letter-spacing: 4px;
        }

        .hero-cta {
            flex-direction: column;
            align-items: center;
        }

        .btn-primary, .btn-outline {
            width: 220px;
        }

        .qrcode-grid {
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .qrcode-section {
            padding: 60px 16px;
        }

        .section-header {
            flex-direction: column;
            gap: 12px;
        }
    }

    /* ========== 减少动画偏好 ========== */
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>

<script>
/* ========== 性能优化：rAF 管理动画时序 ========== */
(function () {
    'use strict';

    const loader   = document.getElementById('loader');
    const homepage = document.getElementById('homepage');

    let rafId = null;
    let isAnimating = false;

    function showHomepage() {
        if (isAnimating) return;
        isAnimating = true;

        // 提示浏览器即将发生 transform 变化
        homepage.style.willChange = 'transform';

        rafId = requestAnimationFrame(() => {
            rafId = requestAnimationFrame(() => {
                loader.classList.add('hidden');
                homepage.classList.add('show');

                // ✅ 关键修复：不再手动清空 transform
                // 由 CSS .homepage.show 控制最终状态
                // homepage.style.transform = ''; ← 删除此行

                document.body.style.overflow = 'auto';

                setTimeout(() => {
                    loader.style.display = 'none';
                    loader.setAttribute('aria-hidden', 'true');
                    homepage.style.willChange = 'auto';
                    isAnimating = false;
                }, 1000);
            });
        });
    }

    // 等待所有资源加载完毕再执行动画，避免中途打断
    function initPage() {
        if (document.readyState === 'complete') {
            setTimeout(showHomepage, 2200);
        } else {
            window.addEventListener('load', () => {
                setTimeout(showHomepage, 2200);
            });
        }
    }

    initPage();

    /* ========== 图片加载失败兜底 ========== */
    document.addEventListener('error', function (e) {
        if (!e.target.matches('.qrcode-card img')) return;

        const wrap = e.target.parentElement;
        if (wrap) {
            wrap.innerHTML = `
                <div style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:rgba(124,58,237,0.05);
                    color:#a09bb5;
                    font-size:14px;
                    letter-spacing:2px;
                    border-radius:24px;
                ">
                    图片加载失败
                </div>
            `;
        }
    }, true);

    /* ========== 页面隐藏时暂停动画 ========== */
    document.addEventListener('visibilitychange', function () {
        if (document.hidden && rafId) {
            cancelAnimationFrame(rafId);
            isAnimating = false;
        }
    });

    /* ========== 处理浏览器前进/后退缓存（bfcache） ========== */
    window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
            // 从缓存恢复时，强制修正状态
            loader.classList.add('hidden');
            loader.style.display = 'none';
            homepage.classList.add('show');
            document.body.style.overflow = 'auto';
        }
    });

})();
</script>
